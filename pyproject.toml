[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfbook-translator"
version = "0.1.0"
description = "Traduzione di libri PDF con conservazione del layout (vettoriale)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pymupdf>=1.24,<2",
    "pyphen>=0.17",
    "requests>=2.31",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
imaging = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pdfbook = "pdfbook.cli:main"
pdfbook-gui = "pdfbook.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
