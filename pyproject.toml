[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfbook-translator"
version = "0.2.0"
description = "Traduzione di libri PDF con conservazione del layout (vettoriale)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Direles", email = "antoniomarino89@gmail.com" }]
keywords = ["pdf", "translation", "layout", "typesetting", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pymupdf>=1.24,<2",
    "pyphen>=0.17",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Direles/LitteraLit"
Issues = "https://github.com/Direles/LitteraLit/issues"
Source = "https://github.com/Direles/LitteraLit"

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
imaging = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pdfbook = "pdfbook.cli:main"
pdfbook-gui = "pdfbook.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
